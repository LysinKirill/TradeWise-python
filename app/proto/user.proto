syntax = "proto3";

package user;

import "google/protobuf/empty.proto";

service UserService {
  rpc GetAccounts (GetAccountsRequest) returns (GetAccountsResponse);
  rpc AddInvestApiKey(AddInvestApiKeyRequest) returns (google.protobuf.Empty);
  rpc GetPortfolio(google.protobuf.Empty) returns (GetPortfolioResponse);
}

message GetPortfolioResponse {
  double ruble_balance = 1;
  repeated Position positions = 2;
}

message Position {
  string instrument_id = 1;
  int32 quantity = 2;
  string ticker = 3;
  float daily_yield = 4;
  float current_price = 5;
}

message GetAccountsRequest {
  AccountStatus account_status = 1;
}

message GetAccountsResponse {
  repeated AccountInfo accounts = 1;
}

message AddInvestApiKeyRequest {
  string api_key = 1;
}

message AccountInfo {
  string id = 1;
  string name = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_NEW = 1;
  ACCOUNT_STATUS_OPEN = 2;
  ACCOUNT_STATUS_CLOSED = 3;
  ACCOUNT_STATUS_ALL = 4;
}
