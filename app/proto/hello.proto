syntax = "proto3";

package hello;

service HelloWorld {
    rpc SayHello (HelloRequest) returns (HelloResponse);
    rpc Echo (EchoRequest) returns (EchoResponse);
}

message HelloRequest {
    string name = 1;
}

message HelloResponse {
    string message = 1;
}

message EchoRequest {
    string text = 1;
}

message EchoResponse {
    string text = 1;
}
